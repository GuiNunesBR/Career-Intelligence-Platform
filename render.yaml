services:
  - type: web
    name: career-lake-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: career-lake-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: career-lake-db
    databaseName: careerlake
    user: career_user
