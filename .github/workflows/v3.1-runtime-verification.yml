name: V3.1 Runtime Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  runtime-verification:
    runs-on: ubuntu-latest

    env:
      # The application runs on SQLite (libsql). Point the DB connection at a
      # throwaway file for migrations and tests.
      SQLITE_URL: file:./ci-sqlite.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SQLite Migration
        run: npm run db:migrate

      - name: Validate TypeScript Compilation
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/tsc.log
          status=${PIPESTATUS[0]}
          cat /tmp/tsc.log
          exit $status

      - name: Run Repository Tests (Tenant Isolation & DB Constraints)
        run: npx vitest run server/repositories/__tests__/sqlite.repositories.test.ts

      - name: Run Integration Tests (API + Repositories + Gate 0)
        run: npm run test

      - name: Validate Production Build
        run: npm run build

      - name: Validate Server.js Generation
        run: |
          if [ ! -f "server.js" ]; then
            echo "Error: server.js was not generated by npm run build"
            exit 1
          fi
          echo "server.js found. Size: $(stat -c%s server.js) bytes"

      - name: Deployment/Runtime Gate (Server Boot & HTTP Check)
        run: |
          PORT=3000 npm start &
          SERVER_PID=$!

          echo "Waiting for server to boot..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health > /dev/null; then
              echo "Server is up!"
              RESPONSE=$(curl -s http://localhost:3000/api/health)
              echo "Response: $RESPONSE"
              if echo "$RESPONSE" | grep -q '"status":"ok"'; then
                echo "Health check passed!"
                kill -TERM $SERVER_PID
                wait $SERVER_PID || true
                exit 0
              else
                echo "Health check failed! Invalid response."
                kill -TERM $SERVER_PID
                exit 1
              fi
            fi
            sleep 1
          done

          echo "Server failed to boot within 30 seconds."
          kill -9 $SERVER_PID
          exit 1
