name: V3.1 Runtime Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  runtime-verification:
    runs-on: ubuntu-latest
    
    # PostgreSQL Service Container
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: career_user
          POSTGRES_PASSWORD: career_password
          POSTGRES_DB: career_lake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career_user -d career_lake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Inject the connection string for Drizzle and tests
      DATABASE_URL: postgresql://career_user:career_password@localhost:5432/career_lake_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Migrations via Drizzle
        run: npm run db:migrate

      - name: Validate TypeScript Compilation
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/tsc.log || true
          status=${PIPESTATUS[0]}
          cat /tmp/tsc.log
          exit $status

      - name: Run PgRepositories Tests (Tenant Isolation & DB Constraints)
        run: npx vitest run server/repositories/__tests__/pg.repositories.test.ts

      - name: Run Integration Tests (API + PgRepositories + Gate 0)
        run: npm run test

      - name: Validate Production Build
        run: npm run build

      - name: Validate Server.js Generation
        run: |
          if [ ! -f "server.js" ]; then
            echo "Error: server.js was not generated by npm run build"
            exit 1
          fi
          echo "server.js found. Size: $(stat -c%s server.js) bytes"

      - name: Deployment/Runtime Gate (Server Boot & HTTP Check)
        run: |
          PORT=3000 npm start &
          SERVER_PID=$!
          
          echo "Waiting for server to boot..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health > /dev/null; then
              echo "Server is up!"
              RESPONSE=$(curl -s http://localhost:3000/api/health)
              echo "Response: $RESPONSE"
              if echo "$RESPONSE" | grep -q '"status":"ok"'; then
                echo "Health check passed!"
                kill -TERM $SERVER_PID
                wait $SERVER_PID || true
                exit 0
              else
                echo "Health check failed! Invalid response."
                kill -TERM $SERVER_PID
                exit 1
              fi
            fi
            sleep 1
          done
          
          echo "Server failed to boot within 30 seconds."
          kill -9 $SERVER_PID
          exit 1
