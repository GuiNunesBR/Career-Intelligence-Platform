name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  runtime-verification:
    runs-on: ubuntu-latest

    env:
      # The application runs on SQLite (libsql). Point the DB connection at a
      # throwaway file for migrations and tests.
      SQLITE_URL: file:./ci-sqlite.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The ATS CV export test renders a real PDF. Install Puppeteer's Chrome explicitly
      # instead of relying on the package's install script.
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run SQLite Migration
        run: npm run db:migrate

      - name: Validate TypeScript Compilation
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/tsc.log
          status=${PIPESTATUS[0]}
          cat /tmp/tsc.log
          exit $status

      - name: Run Repository Tests (Tenant Isolation & DB Constraints)
        run: npx vitest run server/repositories/__tests__/sqlite.repositories.test.ts

      # tests/runner.ts points the suites at their own throwaway ./sqlite.test.db
      - name: Run Tests (Auth, Ownership, AI grounding, API integration, Job search, PDF export)
        run: npm run test

      - name: Validate Production Build
        run: npm run build

      - name: Validate Server.js Generation
        run: |
          if [ ! -f "server.js" ]; then
            echo "Error: server.js was not generated by npm run build"
            exit 1
          fi
          echo "server.js found. Size: $(stat -c%s server.js) bytes"

      - name: Deployment/Runtime Gate (Server Boot, Health & Security Headers)
        run: |
          NODE_ENV=production PORT=3000 npm start &
          SERVER_PID=$!

          echo "Waiting for server to boot..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health > /dev/null; then
              RESPONSE=$(curl -s http://localhost:3000/api/health)
              HEADERS=$(curl -s -D - -o /dev/null http://localhost:3000/api/health)
              kill -TERM $SERVER_PID
              wait $SERVER_PID || true
              echo "Response: $RESPONSE"
              echo "$RESPONSE" | grep -q '"status":"ok"' || { echo "Health check failed! Invalid response."; exit 1; }
              echo "$HEADERS" | grep -qi '^content-security-policy:' || { echo "Missing Content-Security-Policy header"; exit 1; }
              if echo "$HEADERS" | grep -qi '^x-powered-by:'; then echo "X-Powered-By must not be sent"; exit 1; fi
              echo "Health and security header checks passed!"
              exit 0
            fi
            sleep 1
          done

          echo "Server failed to boot within 30 seconds."
          kill -9 $SERVER_PID
          exit 1
